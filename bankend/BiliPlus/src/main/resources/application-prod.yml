server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

app:
  external-url: ${EXTERNAL_URL:http://localhost:8081}
  # 生产必须显式配置，逗号分隔真实前端域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  application:
    name: BiliPlus
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:biliplus}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          starttls:
            enable: true
            required: true
        debug: false

  servlet:
    multipart:
      max-file-size: 200MB   # 👈 根据 2GB 内存和 40GB 硬盘合理限制（原 1GB 太大！）
      max-request-size: 200MB

  data:
    redis:
      database: 0
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 20000
      jedis:
        pool:
          max-active: 10    # 👈 降低连接数，节省内存
          max-idle: 5
          min-idle: 1
          max-wait-millis: 2000

  # ⚠️ 注意：Spring Boot 2.6+ 不再推荐用 web.resources 配置静态资源路径
  # 视频和图片将通过 Nginx 直接提供，Java 只负责上传，不负责访问！

# JWT 配置 - 必须通过环境变量注入，禁止使用默认值
biliplus:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET}
    admin-ttl: 86400000
    admin-token-name: token
  peoplejwt:
    people-secret-key: ${JWT_PEOPLE_SECRET}
    people-ttl: 86400000
    people-token-name: peopleToken

# 📁 路径改为部署环境路径（默认与宝塔示例一致）
video:
  upload:
    base-path: ${VIDEO_UPLOAD_PATH:/www/wwwroot/videos/}      # 👈 视频存储目录（与宝塔一致）
    temp-path: ${VIDEO_TEMP_PATH:/www/wwwroot/videos/temp/}   # 分片临时目录
    access-prefix: /videos/                                   # 前端访问前缀（对应 Nginx /videos/）

image:
  upload:
    base-path: ${IMAGE_UPLOAD_PATH:/www/wwwroot/images/}      # 👈 图片存储目录
    access-prefix: /images/

# 直播：生产按实际 SRS 部署注入，无 RTC 时保持 false（连麦走降级提示）
live:
  srs:
    rtmp-host: ${SRS_RTMP_HOST}
    rtmp-port: ${SRS_RTMP_PORT:1935}
    http-flv-base: ${SRS_FLV_BASE}
    rtc-enabled: ${SRS_RTC_ENABLED:false}
  pk:
    default-duration-sec: ${LIVE_PK_DURATION_SEC:300}
  gift:
    max-count-per-request: 100
  # 直播回放：SRS 开启录制后打开，并给出录制文件点播地址模板
  replay:
    enabled: ${LIVE_REPLAY_ENABLED:false}
    play-url-template: ${LIVE_REPLAY_URL_TEMPLATE:}
