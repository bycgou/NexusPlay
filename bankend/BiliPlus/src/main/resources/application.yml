server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8081}
app:
  external-url: ${EXTERNAL_URL:http://localhost:8081}
  # 跨域允许来源，逗号分隔。生产环境必须通过 CORS_ALLOWED_ORIGINS 覆盖为真实域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
spring:
  application:
    name: BiliPlus
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biliplus}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # 邮件相关设置
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          starttls:
            enable: true
            required: true
        debug: false
  # 文件上传相关设置（优化大小限制）
  servlet:
    multipart:
      max-file-size: 1024MB  # 单个文件最大1GB（视频文件较大，原10MB不够）
      max-request-size: 4096MB  # 单次请求最大4GB
  # redis相关设置
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      jedis:
        pool:
          max-active: 20
          max-idle: 8
          max-wait-millis: -1
          min-idle: 0
      timeout: 20000
  # 静态资源配置（核心：解决路径冲突）
#  web:
#    resources:
#      # 静态资源存储目录：整合视频、图片的本地存储路径
#      static-locations:
#        - file:${video.upload.base-path}  # 视频存储目录（D:/MyOSS/biliPlus/video-website/Videos/）
#        - file:${image.upload.local-path} # 图片存储目录（D:/MyOSS/biliPlus/video-website/Images/）
#      # 静态资源访问映射（关键：区分接口和静态资源）
#      mapping:
#        /video-files/**: file:${video.upload.base-path}  # 视频访问路径：/video-files/xxx.mp4
#        /images/**: file:${image.upload.local-path}      # 图片访问路径：/images/xxx.jpg

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com/biliplus/pojo/entity
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰（正确）

biliplus:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:biliPlusAdminSecretKey2024}
    admin-ttl: 86400000
    admin-token-name: token
  peoplejwt:
    people-secret-key: ${JWT_PEOPLE_SECRET:biliPlusPeopleSecretKey2024}
    people-ttl: 86400000
    people-token-name: peopleToken

# 视频上传配置（路径按部署环境注入，默认值仅用于本地开发）
video:
  upload:
    base-path: ${VIDEO_UPLOAD_PATH:D:/MyOSS/biliPlus/video-website/Videos/}  # 视频实际存储路径
    temp-path: ${VIDEO_TEMP_PATH:D:/MyOSS/biliPlus/video-website/temp/}      # 分片临时存储路径
    access-prefix: /video-files/  # 视频访问前缀（与静态资源mapping一致）

# 图片上传配置
image:
  upload:
    base-path: ${IMAGE_UPLOAD_PATH:D:/MyOSS/biliPlus/video-website/Images/}
    access-prefix: /images/

# 直播配置（SRS）
live:
  srs:
    rtmp-host: ${SRS_RTMP_HOST:localhost}
    rtmp-port: ${SRS_RTMP_PORT:1935}
    http-flv-base: ${SRS_FLV_BASE:http://localhost:8080/live}
    # 无 RTC 环境时保持 false，连麦会返回 rtcAvailable=false 并给出降级提示
    rtc-enabled: ${SRS_RTC_ENABLED:false}
  pk:
    default-duration-sec: ${LIVE_PK_DURATION_SEC:300}
  gift:
    max-count-per-request: 100
  # 直播回放：无录制环境保持 enabled=false，下播时不写回放记录
  replay:
    enabled: ${LIVE_REPLAY_ENABLED:false}
    # 录制文件点播地址模板，{streamKey} 会被替换为下播时的流密钥
    play-url-template: ${LIVE_REPLAY_URL_TEMPLATE:}